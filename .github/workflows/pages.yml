# Builds the site and publishes it to GitHub Pages on every push to main.
# On a pull request into main, or on a branch with `gh workflow run pages.yml --ref <branch>`, it builds and tests only:
# this is the check before a merge.
# The Pages source of the repository must be "GitHub Actions" (Settings > Pages).
name: Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time. A deploy that has started runs to its end (as in GitHub's Pages starter workflow);
# a newer push waits for it. Each ref has its own group: a group keeps only one pending run and cancels the
# older one, so a run of a pull request must not share the group of main.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.11.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The build makes road-routes.bin first, so the test of the routes file runs after it.
      - run: pnpm build
        env:
          BASE: /breathing-taipei/
      - run: pnpm test
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
