# On main, it builds the site and publishes it to GitHub Pages. It does not run the tests. Run them on the branch before
# the merge: open a pull request, or run the workflow on the branch. A merge pushed without either is not tested.
# On a pull request into main, or on a branch with `gh workflow run pages.yml --ref <branch>`, it builds without a publish
# and then runs the tests: this is the check before a merge.
# The Pages source of the repository must be "GitHub Actions" (Settings > Pages).
name: Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time. A deploy that has started runs to its end (as in GitHub's Pages starter workflow);
# a newer push waits for it. Each ref has its own group: a group keeps only one pending run and cancels the
# older one, so a run of a pull request must not share the group of main.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.11.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          BASE: /breathing-taipei/
      # road-routes.bin is not in git: each build makes it. Its size goes to the log and the summary of the run, so the
      # size of any past build is in its record:
      #   gh run view <run id> --repo caasi/breathing-taipei --log | grep -E 'road-routes.bin: [0-9]+ bytes'
      - run: |
          raw=$(wc -c < dist/road-routes.bin) gz=$(gzip -6 -c dist/road-routes.bin | wc -c)
          echo "road-routes.bin: $raw bytes, $gz bytes with gzip -6" | tee -a "$GITHUB_STEP_SUMMARY"
      # The build makes road-routes.bin, which the test of the routes file reads.
      - if: github.ref != 'refs/heads/main'
        run: pnpm test
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Only the deploy gets the Pages permissions, so the build of a pull request cannot publish.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
