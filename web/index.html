<style>@keyframes spin { to { transform: rotate(1turn) } } .spin { animation: spin 1s linear infinite }
/* The title, the clock and the metrics over the map. The two outer columns grow alike, so the clock stays in the middle.
   The metrics stand on the right: right of the clock when the row has room for them, else on a line below.
   ponytail: 820 px is the clock (about 360 px, 2026-10-27) and the metrics (about 200 px with figures of two digits, measured) on each side, with the gaps; a
   longer day name (a holiday) can still meet the metrics, then measure the clock or raise this. */
.top { container-type: inline-size; pointer-events: none }
.top-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; column-gap: 16px; row-gap: 4px }
.top-row.phone { grid-template-columns: auto 1fr }
.top-row .metrics { grid-column: 1 / -1; justify-self: end }
/* margin-top: the top of the glyphs of the title, 28 px bold, measured in a screenshot. */
@container (min-width: 820px) { .top-row:not(.phone) .metrics { grid-column: 3; grid-row: 1; margin-top: 6px } }

/* One height for the buttons of the settings: a button with Chinese text was taller, as its font has a taller line.
   ponytail: 24 px by eye, a little taller than the Latin buttons were. */
.settings button { box-sizing: border-box; height: 24px; padding: 0 6px; line-height: 1; vertical-align: middle; display: inline-flex; align-items: center; justify-content: center }
@media (prefers-reduced-motion: reduce) { .spin { animation: none } }</style></head>
